<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontrak Karyawan – PKWT & PKWTT</title>
<style>
:root{--bg:#e7efed;--hd:#0b4f45;--hdx:#fff;--sf:#fff;--tx:#17211d;--mu:#5d6b65;--ln:#d6ddd9;--ac:#0f6b5c;--acx:#fff;--r:#b3261e;--rb:#fbe4e2;--o:#a04a00;--ob:#fdeacd;--y:#7a6200;--yb:#fbf2c4;--g:#1d6b3a;--gb:#dff1e4;--b:#2a4f8f;--bb:#e2eaf8}
@media (prefers-color-scheme:dark){:root{--bg:#0e1412;--hd:#0f2a26;--hdx:#e8eeeb;--sf:#1a2220;--tx:#e8eeeb;--mu:#9aaaa3;--ln:#2e3b37;--ac:#4cc3ac;--acx:#06201a;--r:#ff9a92;--rb:#4a1f1c;--o:#ffbb7a;--ob:#47300f;--y:#ecd55c;--yb:#40380e;--g:#8fdba6;--gb:#17381f;--b:#9fbdf2;--bb:#1b2b4a}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
header{background:var(--hd);color:var(--hdx);box-shadow:0 1px 4px rgba(0,0,0,.2);padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font:700 18px Georgia,serif;margin:0}h1 small{display:block;font:400 12px "Segoe UI",sans-serif;color:inherit;opacity:.75}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;padding:7px 13px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.btn.d{color:var(--r)}
nav button{font:inherit;padding:7px 14px;border:1px solid transparent;background:transparent;color:var(--hdx);border-radius:6px;cursor:pointer;opacity:.85}
nav button:hover{background:rgba(255,255,255,.14);opacity:1}
nav button.on{background:var(--hdx);color:var(--hd);opacity:1;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi div{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:8px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}.kpi b{display:block;font-size:24px}.kpi span{color:var(--mu);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
input,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;max-width:100%}.bar input{flex:1;min-width:150px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
th{font-size:12px;color:var(--mu);background:var(--bg);white-space:nowrap}tr:last-child td{border-bottom:0}table tr:not(:first-child):hover td{background:rgba(15,107,92,.06)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.t-r{background:var(--rb);color:var(--r)}.t-o{background:var(--ob);color:var(--o)}.t-y{background:var(--yb);color:var(--y)}.t-g{background:var(--gb);color:var(--g)}.t-b{background:var(--bb);color:var(--b)}.t-n{background:var(--bg);color:var(--mu)}
.mu{color:var(--mu);font-size:12px}.empty{padding:28px;text-align:center;color:var(--mu)}
h2{font:700 16px Georgia,serif;margin:20px 0 8px}
dialog{border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);width:min(560px,94vw);padding:18px}dialog::backdrop{background:rgba(0,0,0,.45)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}.grid .w{grid-column:1/-1}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
body.lg{background:var(--hd)}
#login{max-width:360px;margin:12vh auto;padding:28px;background:var(--sf);border:1px solid var(--ln);border-top:5px solid var(--ac);box-shadow:0 8px 28px rgba(0,0,0,.25);border-radius:10px;display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div id="login" hidden>
  <h1>Kontrak Karyawan<small>Masuk dengan akun dari HRD pusat</small></h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn p" data-a="login">Masuk</button>
  <div id="lerr" class="mu" style="color:var(--r)"></div>
</div>
<div id="app" hidden>
  <header><h1>Kontrak Karyawan<small id="who"></small></h1>
  <nav id="nav"></nav></header>
  <main id="m"></main>
</div>
<dialog id="dlg"><div id="db"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ISI DUA BARIS INI (Supabase > Project Settings > API)
const SB_URL="https://vxnnrtroqvzhpceshhhm.supabase.co", SB_KEY="sb_publishable_EItPBmxk60ZehWK9pkAX3g_DeLYuFWt";

const LIB_OK=typeof supabase!=="undefined";
const CFG_OK=LIB_OK&&/^https:\/\/.+\.supabase\.co/.test(SB_URL)&&SB_KEY.length>30;
const sb=CFG_OK?supabase.createClient(SB_URL,SB_KEY):null;
const S={me:null,admin:false,cab:[],rows:[],users:[],tab:1,q:"",fc:"",fj:"",win:60};
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D=s=>{if(!s)return null;const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const left=r=>r.jenis!=="PKWT"||!r.akhir?null:Math.round((D(r.akhir)-today())/864e5);
const fmt=s=>s?D(s).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"-";
const cn=id=>(S.cab.find(c=>c.id==id)||{}).nama||"-";
const opts=(list,sel,all)=>(all!=null?`<option value="">${all}</option>`:"")+list.map(c=>`<option value="${c.id}"${c.id==sel?" selected":""}>${esc(c.nama)}</option>`).join("");
function status(r){const n=left(r);
 if(r.jenis==="PKWTT")return["Tetap","t-g"];if(n===null)return["Tanpa tgl akhir","t-n"];
 if(n<0)return["Lewat "+(-n)+" hr","t-r"];if(n<=7)return[n+" hari lagi","t-r"];if(n<=30)return[n+" hari lagi","t-o"];
 if(n<=60)return[n+" hari lagi","t-y"];if(n<=90)return[n+" hari lagi","t-b"];return[n+" hari lagi","t-g"]}

async function init(){
 if(!sb){const m=!LIB_OK?"Library Supabase gagal dimuat. Pastikan perangkat tersambung internet, lalu muat ulang halaman.":"Website belum dikonfigurasi. Buka index.html dengan Notepad, isi SB_URL dan SB_KEY sesuai Project Settings > API di Supabase (lihat PANDUAN.md langkah 3).";
  document.body.insertAdjacentHTML("afterbegin",'<div style="max-width:480px;margin:12vh auto;padding:20px;background:var(--sf);border:1px solid var(--ln);border-radius:10px">'+m+'</div>');return}
 const{data:{session}}=await sb.auth.getSession();session?load():(($("login").hidden=false),document.body.classList.add("lg"))}
async function login(){
 const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
 if(error){$("lerr").textContent="Email atau password salah.";return}
 $("login").hidden=true;document.body.classList.remove("lg");load()}
async function logout(){await sb.auth.signOut();location.reload()}
async function load(){
 const{data:{user}}=await sb.auth.getUser();
 const p=await sb.from("profiles").select("*").eq("id",user.id).single();
 S.me=p.data;if(!S.me){alert("Profil tidak ditemukan. Hubungi HRD pusat.");return logout()}
 S.admin=S.me.role==="admin";
 const c=await sb.from("cabang").select("*").order("id");S.cab=c.data||[];
 await rows();
 if(S.admin){const u=await sb.from("profiles").select("*").order("email");S.users=u.data||[]}
 $("who").textContent=S.admin?"HRD pusat · semua cabang":(S.me.cabang_id?"PJ "+cn(S.me.cabang_id):"Akun belum ditetapkan ke cabang");
 $("app").hidden=false;render()}
async function rows(){const k=await sb.from("karyawan").select("*").order("nama").limit(5000);S.rows=k.data||[]}
const err=e=>e&&alert("Gagal: "+e.message);

function render(){
 $("nav").innerHTML=[["1","Reminder"],["2","Database"]].concat(S.admin?[["3","Pengguna"]]:[]).map(t=>`<button data-a="tab" data-v="${t[0]}" class="${S.tab==t[0]?"on":""}">${t[1]}</button>`).join("")+'<button data-a="logout">Keluar</button>';
 $("m").innerHTML=!S.admin&&!S.me.cabang_id?'<div class="empty">Akun Anda belum ditetapkan ke cabang. Hubungi HRD pusat.</div>':S.tab==1?vRem():S.tab==2?vDb():vUsers()}

function vRem(){
 const R=S.rows,pk=R.filter(r=>r.jenis==="PKWT"),lw=pk.filter(r=>left(r)!==null&&left(r)<0).length,
 d30=pk.filter(r=>left(r)!==null&&left(r)>=0&&left(r)<=30).length,d90=pk.filter(r=>left(r)>30&&left(r)<=90).length;
 let h=`<div class="kpi"><div><b>${R.length}</b><span>Total karyawan</span></div><div><b>${pk.length}</b><span>PKWT</span></div><div><b>${R.length-pk.length}</b><span>PKWTT</span></div><div><b style="color:var(--r)">${lw}</b><span>Sudah lewat</span></div><div><b style="color:var(--o)">${d30}</b><span>Berakhir ≤ 30 hari</span></div><div><b>${d90}</b><span>31–90 hari</span></div></div>`;
 h+=`<div class="bar"><label>PKWT berakhir dalam <select data-a="win">${[30,60,90,180].map(v=>`<option${S.win==v?" selected":""}>${v}</option>`).join("")}</select> hari</label>`+(S.admin?`<select data-a="fc">${opts(S.cab,S.fc,"Semua cabang")}</select>`:"")+`</div>`;
 const L=pk.filter(r=>left(r)!==null&&left(r)<=S.win&&(!S.fc||r.cabang_id==S.fc)).sort((a,b)=>left(a)-left(b));
 h+='<div class="tw"><table><tr><th>Nama</th><th>Cabang</th><th>Jabatan</th><th>PKWT ke-</th><th>Berakhir</th><th>Status</th></tr>';
 if(!L.length)h+=`<tr><td colspan="6" class="empty">${R.length?"Tidak ada PKWT yang berakhir dalam "+S.win+" hari.":"Belum ada data. Buka tab Database."}</td></tr>`;
 L.forEach(r=>{const s=status(r);h+=`<tr><td><b>${esc(r.nama)}</b><div class="mu">${esc(r.nik)}</div></td><td>${esc(cn(r.cabang_id))}</td><td>${esc(r.jabatan)}</td><td>${r.ke||1}</td><td>${fmt(r.akhir)}</td><td><span class="tag ${s[1]}">${s[0]}</span></td></tr>`});
 h+="</table></div>";
 if(S.admin){h+='<h2>Ringkasan per cabang</h2><div class="tw"><table><tr><th>Cabang</th><th>Karyawan</th><th>PKWT</th><th>PKWTT</th><th>PKWT ≤ 30 hari / lewat</th></tr>';
  S.cab.forEach(c=>{const x=R.filter(r=>r.cabang_id==c.id),p=x.filter(r=>r.jenis==="PKWT"),u=p.filter(r=>left(r)!==null&&left(r)<=30).length;
   h+=`<tr><td>${esc(c.nama)}</td><td>${x.length}</td><td>${p.length}</td><td>${x.length-p.length}</td><td>${u?`<span class="tag t-o">${u}</span>`:0}</td></tr>`});h+="</table></div>"}
 return h}

function filt(){const q=S.q.toLowerCase();return S.rows.filter(r=>(!S.fc||r.cabang_id==S.fc)&&(!S.fj||r.jenis===S.fj)&&(!q||(r.nama+" "+(r.nik||"")+" "+(r.jabatan||"")+" "+(r.kontrak||"")).toLowerCase().includes(q)))}
function vDb(){const L=filt();
 let h=`<div class="bar"><input id="q" data-a="q" placeholder="Cari nama, NIK, jabatan, no. kontrak" value="${esc(S.q)}">`+(S.admin?`<select data-a="fc">${opts(S.cab,S.fc,"Semua cabang")}</select>`:"")
 +`<select data-a="fj"><option value="">PKWT & PKWTT</option><option${S.fj==="PKWT"?" selected":""}>PKWT</option><option${S.fj==="PKWTT"?" selected":""}>PKWTT</option></select>
 <button class="btn p" data-a="add">Tambah karyawan</button><button class="btn" data-a="exp">Ekspor CSV</button><label class="btn">Impor CSV<input type="file" accept=".csv,text/csv" data-a="imp" hidden></label></div>
 <p class="mu">${L.length} dari ${S.rows.length} karyawan. Impor CSV kolom: nik, nama, cabang, jabatan, jenis, mulai, akhir, ke, kontrak, cat (tanggal 2026-12-31).</p>
 <div class="tw"><table><tr><th>Nama</th><th>Cabang</th><th>Jabatan</th><th>Jenis</th><th>Mulai</th><th>Berakhir</th><th>Ke-</th><th>Status</th><th></th></tr>`;
 if(!L.length)h+='<tr><td colspan="9" class="empty">Belum ada data yang cocok.</td></tr>';
 L.forEach(r=>{const s=status(r);h+=`<tr><td><b>${esc(r.nama)}</b><div class="mu">${esc(r.nik)}${r.kontrak?" · "+esc(r.kontrak):""}</div></td><td>${esc(cn(r.cabang_id))}</td><td>${esc(r.jabatan)}</td><td>${r.jenis}</td><td>${fmt(r.mulai)}</td><td>${fmt(r.akhir)}</td><td>${r.jenis==="PKWT"?r.ke||1:"-"}</td><td><span class="tag ${s[1]}">${s[0]}</span></td><td style="white-space:nowrap"><button class="btn" data-a="edit" data-v="${r.id}">Ubah</button> <button class="btn d" data-a="del" data-v="${r.id}">Hapus</button></td></tr>`});
 return h+"</table></div>"}

function vUsers(){
 let h='<p class="mu">Buat akun PJ di Supabase (Authentication > Users > Add user), lalu tetapkan cabangnya di sini. PJ yang belum punya cabang tidak bisa melihat data.</p><div class="tw"><table><tr><th>Email</th><th>Peran</th><th>Cabang</th></tr>';
 S.users.forEach(u=>{h+=`<tr><td>${esc(u.email)}</td><td><select data-a="urole" data-v="${u.id}"><option value="pj"${u.role==="pj"?" selected":""}>PJ cabang</option><option value="admin"${u.role==="admin"?" selected":""}>HRD pusat (admin)</option></select></td><td><select data-a="ucab" data-v="${u.id}">${opts(S.cab,u.cabang_id,"- belum ada -")}</select></td></tr>`});
 return h+"</table></div>"}

function formKar(id){
 const r=id?S.rows.find(z=>z.id===id):{jenis:"PKWT",ke:1,cabang_id:S.admin?S.cab[0]?.id:S.me.cabang_id};
 const cl=S.admin?S.cab:S.cab.filter(c=>c.id==S.me.cabang_id);
 $("db").innerHTML=`<h2 style="margin-top:0">${id?"Ubah":"Tambah"} karyawan</h2><div class="grid">
 <label>NIK / ID<input id="f_nik" value="${esc(r.nik)}"></label><label>Nama<input id="f_nama" value="${esc(r.nama)}"></label>
 <label>Cabang<select id="f_cab">${opts(cl,r.cabang_id)}</select></label><label>Jabatan<input id="f_jab" value="${esc(r.jabatan)}"></label>
 <label>Jenis kontrak<select id="f_jenis"><option${r.jenis==="PKWT"?" selected":""}>PKWT</option><option${r.jenis==="PKWTT"?" selected":""}>PKWTT</option></select></label>
 <label>PKWT ke-<input id="f_ke" type="number" min="1" value="${r.ke||1}"></label>
 <label>Tanggal mulai<input id="f_m" type="date" value="${r.mulai||""}"></label><label>Tanggal berakhir (PKWT)<input id="f_a" type="date" value="${r.akhir||""}"></label>
 <label class="w">No. kontrak<input id="f_k" value="${esc(r.kontrak)}"></label><label class="w">Catatan<input id="f_c" value="${esc(r.cat)}"></label></div>
 <p id="ferr" class="mu" style="color:var(--r)"></p><div class="bar" style="justify-content:flex-end;margin:0"><button class="btn" data-a="cx">Batal</button><button class="btn p" data-a="save" data-v="${id||""}">Simpan</button></div>`;
 $("dlg").showModal()}
async function saveKar(id){
 const o={nik:$("f_nik").value.trim(),nama:$("f_nama").value.trim(),cabang_id:+$("f_cab").value,jabatan:$("f_jab").value.trim(),jenis:$("f_jenis").value,
  ke:+$("f_ke").value||1,mulai:$("f_m").value||null,akhir:$("f_a").value||null,kontrak:$("f_k").value.trim(),cat:$("f_c").value.trim(),updated_at:new Date().toISOString()};
 if(!o.nama)return $("ferr").textContent="Nama wajib diisi.";
 if(o.jenis==="PKWT"&&!o.akhir)return $("ferr").textContent="PKWT perlu tanggal berakhir agar reminder berjalan.";
 if(o.jenis==="PKWTT")o.akhir=null;
 const{error}=id?await sb.from("karyawan").update(o).eq("id",id):await sb.from("karyawan").insert(o);
 if(error)return $("ferr").textContent="Gagal menyimpan: "+error.message;
 $("dlg").close();await rows();render()}

const COLS=["nik","nama","cabang","jabatan","jenis","mulai","akhir","ke","kontrak","cat"];
function exportCsv(){
 const q=v=>{v=String(v??"");return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const t=COLS.join(",")+"\n"+filt().map(r=>COLS.map(c=>q(c==="cabang"?cn(r.cabang_id):r[c])).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="karyawan-kontrak.csv";a.click()}
function parseCsv(t){const rows=[];let row=[],c="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==","||ch==";"){row.push(c);c=""}
  else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;row.push(c);c="";if(row.join(""))rows.push(row);row=[]}else c+=ch}
 row.push(c);if(row.join(""))rows.push(row);return rows}
async function importCsv(file){
 const t=parseCsv((await file.text()).replace(/^\ufeff/,""));if(t.length<2)return alert("File kosong atau tanpa baris judul.");
 const h=t[0].map(x=>x.trim().toLowerCase()),out=[],skip=[];
 t.slice(1).forEach((r,i)=>{const g=c=>{const k=h.indexOf(c);return k>-1?(r[k]||"").trim():""};
  const cab=S.admin?S.cab.find(c=>c.nama.toLowerCase()===g("cabang").toLowerCase()):S.cab.find(c=>c.id==S.me.cabang_id);
  const jenis=g("jenis").toUpperCase()==="PKWTT"?"PKWTT":"PKWT";
  if(!g("nama")||!cab)return skip.push(i+2);
  out.push({nik:g("nik"),nama:g("nama"),cabang_id:cab.id,jabatan:g("jabatan"),jenis,mulai:g("mulai")||null,akhir:jenis==="PKWTT"?null:(g("akhir")||null),ke:+g("ke")||1,kontrak:g("kontrak"),cat:g("cat")})});
 for(let i=0;i<out.length;i+=100){const{error}=await sb.from("karyawan").insert(out.slice(i,i+100));if(error)return alert("Gagal impor: "+error.message)}
 await rows();render();alert(out.length+" baris diimpor."+(skip.length?" Dilewati (nama kosong atau cabang tidak dikenal), baris: "+skip.join(", "):""))}

document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==="login")login();else if(a==="logout")logout();else if(a==="tab"){S.tab=+v;S.fc="";render()}
 else if(a==="add")formKar();else if(a==="edit")formKar(v);else if(a==="cx")$("dlg").close();else if(a==="save")saveKar(v);
 else if(a==="exp")exportCsv();
 else if(a==="del"){const r=S.rows.find(z=>z.id===v);if(r&&confirm("Hapus data "+r.nama+"?")){const{error}=await sb.from("karyawan").delete().eq("id",v);err(error);await rows();render()}}});
document.addEventListener("change",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.value;
 if(a==="win"){S.win=+v;render()}else if(a==="fc"){S.fc=v;render()}else if(a==="fj"){S.fj=v;render()}
 else if(a==="imp"&&b.files[0])importCsv(b.files[0]);
 else if(a==="urole"||a==="ucab"){const f=a==="urole"?{role:v}:{cabang_id:v?+v:null};const{error}=await sb.from("profiles").update(f).eq("id",b.dataset.v);err(error);
  const u=await sb.from("profiles").select("*").order("email");S.users=u.data||[]}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const p=e.target.selectionStart;render();const q=$("q");q.focus();q.setSelectionRange(p,p)}});
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
init();
</script>
</body>
</html>
